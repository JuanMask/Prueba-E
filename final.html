<!-- FILE: final.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>SOMOS NOVIOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="IMG/corazon.svg" type="image/svg+xml">
  <style>
    html,body{height:100%; margin:0; overflow:hidden}
    .full-screen{height:100vh; display:flex; align-items:center; justify-content:center; background:#5589c4; color:#fff; position:relative; z-index:1}
    .full-screen h1{font-size:clamp(2rem,6vw,6rem); margin:0}

    /* overlay de corazones (por encima de todo) */
    .hearts-overlay{
      position:fixed;
      inset:0;
      pointer-events:none; /* no interfieren con clicks */
      overflow:hidden;
      z-index:9999;
    }

    /* estilo base para cada corazón */
    .heart{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%) scale(var(--s,1));
      font-size: 28px;
      line-height: 1;
      will-change: transform, opacity;
      opacity:1;
      user-select:none;
      -webkit-user-select:none;
      display:inline-block;
      text-shadow: 0 2px 6px rgba(0,0,0,0.15);
      color: #e91e63; /* rojo copia */
    }

    /* animación: 0% en centro; 30% en punto exterior; 100% cae y desaparece */
    @keyframes heartFlight {
      0% {
        transform: translate(-50%, -50%) scale(var(--s,1));
        opacity: 1;
      }
      30% {
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot,0deg)) scale(var(--s,1));
        opacity: 1;
      }
      100% {
        /* cae 700px más desde el punto exterior y desaparece */
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty) + 700px)) rotate(calc(var(--rot,0deg) + 180deg)) scale(var(--s,1));
        opacity: 0;
      }
    }

    /* Aplica la animación usando variables para duración y delay */
    .heart.animate{
      animation-name: heartFlight;
      animation-timing-function: cubic-bezier(.2,.8,.2,1);
      animation-fill-mode: forwards;
      animation-duration: var(--dur, 4s);
      animation-delay: var(--delay, 0s);
    }

    /* Opcional: ligerísima suavidad en los cambios de posición */
    .heart { transition: transform 120ms linear; }

    /* Aumentar tamaño de algunos corazones usando clases */
    .heart.big{ font-size: 46px; }
    .heart.small{ font-size: 20px; }
  </style>
</head>
<body>

  <main class="full-screen">
    <h1>¡Has llegado al final!</h1>
  </main>

  <!-- overlay donde aparecerán los corazones -->
  <div id="hearts" class="hearts-overlay" aria-hidden="true"></div>

  <!-- AUDIO -->
  <audio id="audioFinal" src="AUDIO/ojos.mp3"></audio>

  <script>
    // Reproduce la canción automáticamente cuando carga final.html
    window.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('audioFinal');

      // Intento de reproducción automática (con fallback en caso de bloqueo)
      audio.play().catch(() => {
        // Si el navegador bloquea autoplay, se reproduce al primer clic
        document.body.addEventListener('click', () => audio.play(), { once: true });
      });

      // Inicia la lluvia/expulsión de corazones
      launchHearts({
        count: 40,         // cuántos corazones crear inicialmente
        burstInterval: 250 // milisegundos entre pequeños grupos (crea sensación de "disparo")
      });
    });

    /**
     * Crea corazones que salen del centro, se dispersan y luego caen dentro de la pantalla.
     * options:
     *  - count: número total aproximado de corazones
     *  - burstInterval: tiempo entre pequeños grupos
     */
    function launchHearts(options = {}) {
      const container = document.getElementById('hearts');
      const total = options.count ?? 40;
      const burstInterval = options.burstInterval ?? 200;

      // genera corazones en pequeños grupos para efecto más natural
      let created = 0;
      const groupSize = 6;
      const timer = setInterval(() => {
        if (created >= total) {
          clearInterval(timer);
          return;
        }
        const toCreate = Math.min(groupSize, total - created);
        for (let i = 0; i < toCreate; i++) {
          createHeart(container);
          created++;
        }
      }, burstInterval);
    }

    function createHeart(container) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      // usar el carácter corazón (puedes cambiar por SVG si prefieres)
      heart.innerHTML = '&#10084;'; // ❤

      // tamaño aleatorio
      const sizeRand = Math.random();
      if (sizeRand > 0.85) heart.classList.add('big');
      else if (sizeRand < 0.25) heart.classList.add('small');

      // posición de vuelo: tx, ty en px (desde el centro). Elegimos una dirección aleatoria con radio
      const angle = Math.random() * Math.PI * 2; // dirección 0..2PI
      const radius = 80 + Math.random() * 220; // qué tan lejos explota inicialmente
      // tx, ty en px respecto al centro (se usan en transform)
      const tx = Math.round(Math.cos(angle) * radius) + 'px';
      const ty = Math.round(Math.sin(angle) * radius) + 'px';

      // rotación aleatoria para darle variedad
      const rot = Math.round((Math.random() - 0.5) * 90) + 'deg';

      // duración y delay
      const dur = (3 + Math.random() * 3).toFixed(2) + 's'; // 3s a 6s
      const delay = (Math.random() * 0.6).toFixed(2) + 's';

      // escala (tamaño visual)
      const scale = (0.7 + Math.random() * 0.9).toFixed(2);

      // asignar variables CSS para la animación
      heart.style.setProperty('--tx', tx);
      heart.style.setProperty('--ty', ty);
      heart.style.setProperty('--dur', dur);
      heart.style.setProperty('--delay', delay);
      heart.style.setProperty('--s', scale);
      heart.style.setProperty('--rot', rot);

      // poner en DOM
      container.appendChild(heart);

      // forzar reflow y luego iniciar la animación
      // (necesario para que animation-delay/animation-duration apliquen correctamente)
      void heart.offsetWidth;
      heart.classList.add('animate');

      // eliminar del DOM al finalizar la animación para no acumular elementos
      heart.addEventListener('animationend', () => {
        // aplicamos una pequeña transición de opacidad por seguridad y luego removemos
        heart.remove();
      }, { once: true });
    }
  </script>
</body>
</html>
